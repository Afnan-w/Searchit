<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Searchit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <h1 class="logo">Searchit</h1>
        <button id="theme-toggle" class="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle theme">
          <span class="icon-sun">&#9788;</span>
          <span class="icon-moon">&#9790;</span>
        </button>
      </div>
      <p class="subtitle">Rokomari</p>
    </header>

    <!-- Search Bar -->
    <div class="search-section">
      <div class="search-input-wrapper">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search products... (English or বাংলা)"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="clear-btn" class="clear-btn" title="Clear search" aria-label="Clear">&times;</button>
      </div>
      <div class="search-actions">
        <button id="search-btn" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          Search
        </button>
      </div>
    </div>

    <!-- Recent Searches -->
    <div id="recent-section" class="recent-section hidden">
      <div class="section-header">
        <span class="section-title">Recent Searches</span>
        <button id="clear-recent-btn" class="text-btn" title="Clear recent searches">Clear</button>
      </div>
      <div id="recent-list" class="recent-list"></div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <span>Searching...</span>
    </div>

    <!-- Error State -->
    <div id="error" class="error hidden">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      <span id="error-message">Something went wrong.</span>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-icon">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <p class="empty-title">Search for any product</p>
      <p class="empty-subtitle">Type a product name in English or Bengali, then press Enter or click Search</p>
    </div>

    <!-- Results Container -->
    <div id="results" class="results hidden">
      <div id="cache-indicator" class="cache-indicator hidden">Showing cached results</div>

      <!-- Offers & Deals -->
      <div class="result-card" id="offers-card">
        <div class="result-header offers">
          <span class="result-site-name">Offers &amp; Deals</span>
        </div>
        <div id="offers-content" class="offers-content"></div>
      </div>

      <!-- Rokomari Results -->
      <div class="result-card" id="rokomari-card">
        <div class="result-header rokomari">
          <span class="result-site-name">Rokomari</span>
          <a id="rokomari-link" class="result-open-link" href="#" target="_blank" rel="noopener noreferrer" title="Open full search on Rokomari">Open full search &rarr;</a>
        </div>
        <div id="rokomari-products" class="product-list"></div>
      </div>

    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>Press <kbd>Enter</kbd> to search</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
